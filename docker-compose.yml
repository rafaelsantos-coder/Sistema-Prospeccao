services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sulnet_prospecta
      POSTGRES_USER: sulnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
    volumes:
      - prospecta_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sulnet -d sulnet_prospecta"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sulnet:${POSTGRES_PASSWORD:-troque-esta-senha}@db:5432/sulnet_prospecta
      APP_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prospecta_db:
