{% extends "base.html" %}
{% block auth_content %}
<div class="auth-layout">
  <section class="auth-brand-panel">
    <div class="auth-brand">
      <span class="brand-mark large">S</span>
      <div><strong>SULNET</strong><span>PROSPECTA</span></div>
    </div>
    <div class="auth-message">
      <span class="eyebrow light">SEGURANÇA</span>
      <h1>Confirme seu<br><em>segundo fator.</em></h1>
      <p>Abra o aplicativo autenticador e informe o código temporário.</p>
    </div>
  </section>
  <section class="auth-form-panel">
    <div class="login-card">
      <div class="login-heading">
        <span class="eyebrow">MFA</span>
        <h2>Verificação em duas etapas</h2>
        <p>{{ pending_user.email }}</p>
      </div>
      {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
      <form method="post" action="/mfa/verify" class="stack-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label class="field">
          <span>Código de 6 dígitos</span>
          <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus>
        </label>
        <button type="submit" class="button button-primary button-large full-width">Validar código</button>
      </form>
    </div>
  </section>
</div>
{% endblock %}
