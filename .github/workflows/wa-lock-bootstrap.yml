name: Gerar lock deterministico do motor WA (unica execucao)
on:
  push:
    branches: [feat/openwa-security-gated-20261127]
    paths:
      - "gateway/package.json"
      - ".github/workflows/wa-lock-bootstrap.yml"
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    if: github.repository == 'rafaelsantos-coder/Sistema-Prospeccao'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
      - name: Gerar lock sem executar scripts de terceiros
        run: |
          cd gateway
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm pkg get dependencies
      - name: Salvar somente o lockfile
        run: |
          git add gateway/package-lock.json
          if git diff --cached --quiet; then
            echo "Lock ja esta atualizado"
          else
            git -c user.name="Sulnet Security CI" -c user.email="actions@users.noreply.github.com" commit -m "build(gateway): pin transitive npm dependencies in lockfile"
            git push origin HEAD:feat/openwa-security-gated-20261127
          fi
