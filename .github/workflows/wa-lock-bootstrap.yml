name: Regenerar lock gateway em branch isolada
on:
  push:
    branches: [feat/openwa-security-gated-20261127]
    paths:
      - gateway/package.json
      - .github/workflows/wa-lock-bootstrap.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    if: github.repository == 'rafaelsantos-coder/Sistema-Prospeccao'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
      - name: Gerar lockfile sem scripts
        run: cd gateway && npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commitar somente a cadeia de versoes
        run: |
          git add gateway/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="Sulnet Security CI" -c user.email="actions@users.noreply.github.com" commit -m "build(gateway): update SDK lockfile"
          git push origin HEAD:feat/openwa-security-gated-20261127
