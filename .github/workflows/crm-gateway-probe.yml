name: CRM gateway probe

on:
  push:
    branches: [test/crm-gateway-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CRM public gateway
        shell: bash
        env:
          BASE: https://oil-burton-americas-largely.trycloudflare.com
        run: |
          set -u
          echo "===== /health ====="
          curl -sS -i --max-time 20 "$BASE/health" || true
          echo

          echo "===== POST /api/capture/login empty ====="
          curl -sS -i --max-time 20 \
            -X POST "$BASE/api/capture/login" \
            -H 'Content-Type: application/json' \
            --data '{}' || true
          echo

          echo "===== POST /api/capture/login username only ====="
          curl -sS -i --max-time 20 \
            -X POST "$BASE/api/capture/login" \
            -H 'Content-Type: application/json' \
            --data '{"username":"Vendedor IA"}' || true
          echo

          echo "===== /api/capture/context no token ====="
          curl -sS -i --max-time 20 "$BASE/api/capture/context" || true
          echo
