name: Testes e Segurança do Sulnet Prospecta

on:
  push:
    branches: [main, feat/zapi-integration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lock-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Gerar lock determinístico
        run: |
          python -m pip install --upgrade pip uv
          uv pip compile requirements.txt \
            --python-version 3.14 \
            --generate-hashes \
            --output-file requirements.lock.generated
      - name: Publicar lock gerado
        uses: actions/upload-artifact@v7
        with:
          name: requirements-lock
          path: requirements.lock.generated
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sulnet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sulnet_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff pip-audit bandit

      - name: Compilar módulos
        run: python -m compileall -q app alembic

      - name: Validar JavaScript e mapa de calor territorial
        run: |
          node --check app/static/js/credit_map.js
          node --check app/static/js/credit_map_heat.js
          node --check app/static/js/voice_campaign_status.js
          node --check app/static/js/conversas_mvp.js
          node --test tests/js/credit_map_heat.test.cjs

      - name: Lint crítico
        run: ruff check app tests --select E9,F63,F7,F82,B --ignore B008

      - name: Validar migrações em banco limpo
        env:
          DATABASE_URL: sqlite:////tmp/sulnet-prospecta-ci.db
          APP_ENV: test
        run: python -m app.migrate

      - name: Validar migrações em PostgreSQL 18
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sulnet_ci
          APP_ENV: test
        run: |
          python -m app.migrate
          alembic current | grep -F "$(alembic heads | awk 'NR==1 {print $1}')"

      - name: Executar testes
        run: pytest -q

      - name: Varredura de segredos no código
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9]{32,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xox[bp]-[A-Za-z0-9-]{20,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':!tests' ':!docs'; then
            echo "Possível segredo no repositório. Remova e troque a chave." && exit 1
          fi

      - name: Auditoria de dependências Python
        run: pip-audit -r requirements.txt

      - name: Análise estática de segurança
        run: bandit -q -r app -x tests -ll

  container-security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Construir imagem
        run: docker build -t sulnet-prospecta:ci .

      - name: Trivy - vulnerabilidades críticas
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sulnet-prospecta:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL


  voice-engine-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Construir motor de telefonia nativo em Python 3.12
        run: docker build -f docker/voice-engine.Dockerfile -t sulnet-prospecta-voice:ci .
      - name: Validar modulo PJSUA2 dentro da imagem
        run: docker run --rm --entrypoint python sulnet-prospecta-voice:ci -c "import pjsua2; import app.workers.voice_engine_worker; print('SIP+RTP+REFER worker imports OK')"
      - name: Trivy - imagem nativa sem vulnerabilidades criticas conhecidas
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sulnet-prospecta-voice:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

  # Redeploy do serviço web em produção após a suíte passar na main.
  # Preferência: RAILWAY_TOKEN (project token) → railway redeploy.
  # Fallback: RAILWAY_DEPLOY_HOOK_URL (Deploy Hook do serviço web).
  # Nota: secrets não podem ser usados em if: do Actions; a escolha fica no shell.
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, container-security]
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy Railway (produção)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
          RAILWAY_NO_TELEMETRY: "1"
        run: |
          set -euo pipefail
          if [ -n "${RAILWAY_TOKEN:-}" ]; then
            curl -fsSL https://railway.com/install.sh | sh
            export PATH="$HOME/.railway/bin:$PATH"
            railway redeploy \
              --project b6e0d26b-bc6b-4879-bddd-4a0d58aba0f0 \
              --environment production \
              --service web \
              --commit "${GITHUB_SHA}" \
              --yes
            echo "Redeploy de produção disparado via Railway CLI (commit ${GITHUB_SHA})."
            exit 0
          fi
          if [ -n "${HOOK_URL:-}" ]; then
            curl -fsS -X POST "$HOOK_URL"
            echo "Redeploy de produção disparado via Deploy Hook."
            exit 0
          fi
          echo "::warning::Configure o secret RAILWAY_TOKEN (project token) ou RAILWAY_DEPLOY_HOOK_URL no repositório. Redeploy automático pulado."
          exit 0
