name: Testes e Segurança do Sulnet Prospecta

on:
  push:
    branches: [main, feat/zapi-integration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff pip-audit bandit

      - name: Compilar módulos
        run: python -m compileall -q app alembic

      - name: Lint crítico
        run: ruff check app tests --select E9,F63,F7,F82,B --ignore B008

      - name: Validar migrações em banco limpo
        env:
          DATABASE_URL: sqlite:////tmp/sulnet-prospecta-ci.db
          APP_ENV: test
        run: alembic upgrade head

      - name: Executar testes
        run: pytest -q

      - name: Auditoria de dependências Python
        run: pip-audit -r requirements.txt

      - name: Análise estática de segurança
        run: bandit -q -r app -x tests -ll

  container-security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagem
        run: docker build -t sulnet-prospecta:ci .

      - name: Trivy - vulnerabilidades críticas
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: sulnet-prospecta:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
