name: Testes e Segurança do Sulnet Prospecta

on:
  push:
    branches: [main, feat/zapi-integration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lock-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
      - name: Gerar lock determinístico
        run: |
          python -m pip install --upgrade pip uv
          uv pip compile requirements.txt \
            --python-version 3.14 \
            --generate-hashes \
            --output-file requirements.lock.generated
      - name: Publicar lock gerado
        uses: actions/upload-artifact@v7
        with:
          name: requirements-lock
          path: requirements.lock.generated
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sulnet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sulnet_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff pip-audit bandit

      - name: Compilar módulos
        run: python -m compileall -q app alembic

      - name: Lint crítico
        run: ruff check app tests --select E9,F63,F7,F82,B --ignore B008

      - name: Validar migrações em banco limpo
        env:
          DATABASE_URL: sqlite:////tmp/sulnet-prospecta-ci.db
          APP_ENV: test
        run: python -m app.migrate

      - name: Validar migrações em PostgreSQL 18
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sulnet_ci
          APP_ENV: test
        run: |
          python -m app.migrate
          alembic current | grep 0015_credit_map_streets

      - name: Executar testes
        run: pytest -q

      - name: Varredura de segredos no código
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9]{32,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xox[bp]-[A-Za-z0-9-]{20,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':!tests' ':!docs'; then
            echo "Possível segredo no repositório. Remova e troque a chave." && exit 1
          fi

      - name: Auditoria de dependências Python
        run: pip-audit -r requirements.txt

      - name: Análise estática de segurança
        run: bandit -q -r app -x tests -ll

  container-security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Construir imagem
        run: docker build -t sulnet-prospecta:ci .

      - name: Trivy - vulnerabilidades críticas
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sulnet-prospecta:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
