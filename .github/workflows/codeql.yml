name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: python

      - uses: github/codeql-action/analyze@v4
        with:
          upload: false
          output: codeql-results

      - name: Falhar em achados CodeQL
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = list(Path("codeql-results").glob("*.sarif"))
          findings = []
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              for run in data.get("runs", []):
                  rules = {
                      item.get("id"): item
                      for item in (run.get("tool", {}).get("driver", {}).get("rules", []) or [])
                  }
                  for result in run.get("results", []) or []:
                      rule_id = result.get("ruleId") or ""
                      level = result.get("level") or "warning"
                      message = (result.get("message") or {}).get("text") or ""
                      places = []
                      for location in result.get("locations") or []:
                          physical = location.get("physicalLocation") or {}
                          uri = (physical.get("artifactLocation") or {}).get("uri") or "?"
                          line = (physical.get("region") or {}).get("startLine") or "?"
                          places.append(f"{uri}:{line}")
                      for related in result.get("relatedLocations") or []:
                          physical = related.get("physicalLocation") or {}
                          uri = (physical.get("artifactLocation") or {}).get("uri") or "?"
                          line = (physical.get("region") or {}).get("startLine") or "?"
                          places.append(f"origem {related.get('id')}: {uri}:{line}")
                      if places:
                          message = f"{message} [{'; '.join(places)}]"
                      findings.append((level, rule_id, message, rules.get(rule_id, {})))

          blocking = [
              item for item in findings
              if item[0] in {"error", "warning"}
          ]
          if blocking:
              print("CodeQL encontrou achados bloqueantes:")
              for level, rule_id, message, _rule in blocking[:50]:
                  print(f"- {level}: {rule_id}: {message}")
              raise SystemExit(1)
          print("CodeQL sem achados bloqueantes.")
          PY
